[project]
name = "finpal-scheduler"
version = "0.1.0"
description = "FinPal 基金数据定时同步服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.15.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.0.0",
    "schedule>=1.2.0",
    "flask>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
scheduler = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# uv 配置
[tool.uv]
python-preference = "only-managed"  # 使用 uv 管理的 Python

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
