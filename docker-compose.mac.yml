services:
    # 1. PostgreSQL 数据库 (使用官方多架构镜像确保 ARM 支持)
    postgres:
        image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:18-alpine-linuxarm64
        container_name: finpal-postgres
        environment:
            POSTGRES_USER: finpal
            POSTGRES_PASSWORD: finpal
            POSTGRES_DB: finpal
        ports:
            - "5432:5432"
        volumes:
            - postgres_data_mac:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U finpal -d finpal"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    # 2. Python Scheduler
    scheduler:
        build:
            context: ./scheduler
            dockerfile: Dockerfile
            args:
                - BASE_IMAGE=swr.cn-north-4.myhuaweicloud.com/ddn-k8s/ghcr.io/astral-sh/uv:python3.11-bookworm-slim-linuxarm64
        container_name: finpal-scheduler-mac
        environment:
            - DATABASE_URL=postgresql://finpal:finpal@postgres:5432/finpal
            - HTTP_HOST=0.0.0.0
            - HTTP_PORT=8000
            - SYNC_TIME=18:00
        ports:
            - "8001:8000"
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped

    # 3. Next.js Web 应用
    web:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                - BASE_IMAGE=swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:20-alpine-linuxarm64
        container_name: finpal-web-mac
        environment:
            - DATABASE_URL=postgresql://finpal:finpal@postgres:5432/finpal
            - SCHEDULER_URL=http://scheduler:8000
            - NODE_ENV=production
        ports:
            - "3412:3000"
        depends_on:
            postgres:
                condition: service_healthy
            scheduler:
                condition: service_started
        restart: unless-stopped
        entrypoint: ["/app/docker-entrypoint.sh"]
        command: ["node", "server.js"]

volumes:
    postgres_data_mac:
